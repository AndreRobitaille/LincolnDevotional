name: Deploy to cPanel (FTPS)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install sharing image tools
        run: python3 -m pip install -r tools/share_requirements.txt

      - name: Validate pages, sharing images, and ESV limits
        run: |
          python3 -m unittest tests.test_generate_entry_pages tests.test_tag_entries_openai tests.test_share_images
          python3 tools/generate_share_images.py --check

      - name: Deploy via FTPS
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/docs/**
            **/data/entry_topics_cache.json
            **/tools/**
            **/tests/**
            **/*.bak
            **/AGENTS.md
            **/CLAUDE.md
            **/README.md
            **/LICENSE
            **/opencode.json
            **/.claude/**
