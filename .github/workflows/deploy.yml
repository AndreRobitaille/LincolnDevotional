name: Temporary approved htaccess verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the approved rule and remove it
        run: python3 tools/verify_htaccess.py
      - name: Ensure the temporary rule is removed
        if: always()
        run: python3 tools/verify_htaccess.py --cleanup
